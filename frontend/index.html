<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini GPT — ChatGPT Interface</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .typing-dot {
      animation: pulse-dot 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    pre code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="bg-[#0f1117] text-gray-100 h-screen overflow-hidden font-sans">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_PROMPTS = [
      "What is the core principle behind the Transformer architecture?",
      "How does self-attention compute relationships between tokens?",
      "Tell me about stellar nucleosynthesis in Orion.",
      "Explain the time complexity of binary search."
    ];

    function App() {
      const [messages, setMessages] = useState([
        {
          id: "welcome",
          role: "assistant",
          content: "Hello! I am **Mini GPT**, an autoregressive Transformer language model built from scratch in PyTorch. Ask me about transformers, deep learning, algorithms, or physics!",
          tokens: 28,
          latency: 0
        }
      ]);
      const [input, setInput] = useState("");
      const [isLoading, setIsLoading] = useState(false);
      const [modelInfo, setModelInfo] = useState(null);

      // Hyperparameter states
      const [temperature, setTemperature] = useState(0.8);
      const [topK, setTopK] = useState(20);
      const [topP, setTopP] = useState(0.9);
      const [repPenalty, setRepPenalty] = useState(1.1);
      const [maxTokens, setMaxTokens] = useState(120);

      const messagesEndRef = useRef(null);

      // Fetch model architecture info on mount
      useEffect(() => {
        fetch("/api/model-info")
          .then(res => res.json())
          .then(data => setModelInfo(data))
          .catch(err => console.log("Model info offline, using mock"));
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isLoading]);

      const handleSend = async (customText = null) => {
        const textToSend = customText || input;
        if (!textToSend.trim() || isLoading) return;

        const userMsg = {
          id: Date.now().toString(),
          role: "user",
          content: textToSend.trim()
        };

        const updatedMessages = [...messages, userMsg];
        setMessages(updatedMessages);
        setInput("");
        setIsLoading(true);

        const startTime = performance.now();

        try {
          // Format messages for API
          const payload = {
            messages: updatedMessages.map(m => ({ role: m.role, content: m.content })),
            temperature: parseFloat(temperature),
            top_k: parseInt(topK),
            top_p: parseFloat(topP),
            repetition_penalty: parseFloat(repPenalty),
            max_tokens: parseInt(maxTokens)
          };

          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          setMessages(prev => [
            ...prev,
            {
              id: (Date.now() + 1).toString(),
              role: "assistant",
              content: data.response || "No response generated.",
              tokens: data.tokens_generated,
              latency: data.generation_time_ms
            }
          ]);
        } catch (err) {
          setMessages(prev => [
            ...prev,
            {
              id: (Date.now() + 1).toString(),
              role: "assistant",
              content: `*Error connecting to Mini GPT backend: ${err.message}*`,
              tokens: 0,
              latency: 0
            }
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleClear = async () => {
        setMessages([]);
        try {
          await fetch("/api/clear", { method: "POST" });
        } catch (e) {}
      };

      return (
        <div class="flex h-screen w-screen overflow-hidden">
          {/* Sidebar */}
          <aside class="w-80 bg-[#161822] border-r border-gray-800 flex flex-col justify-between p-4 hidden md:flex">
            <div>
              <div class="flex items-center gap-3 mb-6 px-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/20">
                  G
                </div>
                <div>
                  <h1 class="font-bold text-base tracking-wide text-white">Mini GPT</h1>
                  <span class="text-xs text-emerald-400 flex items-center gap-1.5 font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Ready · PyTorch Scratch
                  </span>
                </div>
              </div>

              <button
                onClick={handleClear}
                class="w-full py-2.5 px-4 rounded-xl border border-gray-700 hover:border-gray-600 bg-gray-800/40 hover:bg-gray-800 text-sm font-medium transition flex items-center justify-center gap-2 mb-6"
              >
                <span>+</span> New Conversation
              </button>

              {/* Hyperparameter Controls */}
              <div class="space-y-4 text-xs">
                <h3 class="text-gray-400 font-semibold uppercase tracking-wider text-[10px]">Sampling Controls</h3>
                
                <div>
                  <div class="flex justify-between text-gray-300 mb-1">
                    <span>Temperature</span>
                    <span class="font-mono text-indigo-400">{temperature}</span>
                  </div>
                  <input
                    type="range" min="0.1" max="1.5" step="0.05"
                    value={temperature}
                    onChange={(e) => setTemperature(e.target.value)}
                    class="w-full accent-indigo-500"
                  />
                </div>

                <div>
                  <div class="flex justify-between text-gray-300 mb-1">
                    <span>Top-K Cutoff</span>
                    <span class="font-mono text-indigo-400">{topK}</span>
                  </div>
                  <input
                    type="range" min="1" max="50" step="1"
                    value={topK}
                    onChange={(e) => setTopK(e.target.value)}
                    class="w-full accent-indigo-500"
                  />
                </div>

                <div>
                  <div class="flex justify-between text-gray-300 mb-1">
                    <span>Top-P (Nucleus)</span>
                    <span class="font-mono text-indigo-400">{topP}</span>
                  </div>
                  <input
                    type="range" min="0.1" max="1.0" step="0.05"
                    value={topP}
                    onChange={(e) => setTopP(e.target.value)}
                    class="w-full accent-indigo-500"
                  />
                </div>

                <div>
                  <div class="flex justify-between text-gray-300 mb-1">
                    <span>Repetition Penalty</span>
                    <span class="font-mono text-indigo-400">{repPenalty}</span>
                  </div>
                  <input
                    type="range" min="1.0" max="1.5" step="0.05"
                    value={repPenalty}
                    onChange={(e) => setRepPenalty(e.target.value)}
                    class="w-full accent-indigo-500"
                  />
                </div>

                <div>
                  <div class="flex justify-between text-gray-300 mb-1">
                    <span>Max Tokens</span>
                    <span class="font-mono text-indigo-400">{maxTokens}</span>
                  </div>
                  <input
                    type="range" min="20" max="300" step="10"
                    value={maxTokens}
                    onChange={(e) => setMaxTokens(e.target.value)}
                    class="w-full accent-indigo-500"
                  />
                </div>
              </div>
            </div>

            {/* Model Architecture Specs */}
            <div class="bg-gray-900/80 rounded-xl p-3 border border-gray-800 text-[11px] text-gray-400 space-y-1 font-mono">
              <div class="text-gray-300 font-sans font-semibold mb-1 text-xs">Model Architecture</div>
              <div class="flex justify-between"><span>Parameters:</span><span class="text-white">{modelInfo ? modelInfo.parameters.toLocaleString() : "818,688"}</span></div>
              <div class="flex justify-between"><span>Layers (Depth):</span><span class="text-white">{modelInfo ? modelInfo.n_layer : "4"} Blocks</span></div>
              <div class="flex justify-between"><span>Attention Heads:</span><span class="text-white">{modelInfo ? modelInfo.n_head : "4"} Heads</span></div>
              <div class="flex justify-between"><span>Embedding Dim:</span><span class="text-white">{modelInfo ? modelInfo.n_embd : "128"}</span></div>
              <div class="flex justify-between"><span>Context Window:</span><span class="text-white">{modelInfo ? modelInfo.block_size : "128"}</span></div>
              <div class="flex justify-between"><span>Compute Device:</span><span class="text-indigo-400 font-bold">{modelInfo ? modelInfo.device.toUpperCase() : "CPU"}</span></div>
            </div>
          </aside>

          {/* Main Chat Interface */}
          <main class="flex-1 flex flex-col h-full bg-[#0f1117] relative">
            {/* Header */}
            <header class="h-14 border-b border-gray-800/80 flex items-center justify-between px-6 bg-[#0f1117]/80 backdrop-blur z-10">
              <div class="flex items-center gap-2">
                <span class="font-semibold text-sm text-gray-200">Mini GPT Chat</span>
                <span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium">
                  Decoder-Only
                </span>
              </div>
              <button
                onClick={handleClear}
                class="text-xs text-gray-400 hover:text-rose-400 transition flex items-center gap-1"
                title="Reset conversation"
              >
                Clear History
              </button>
            </header>

            {/* Message Area */}
            <div class="flex-1 overflow-y-auto px-4 md:px-24 py-6 space-y-6">
              {messages.length === 0 && (
                <div class="h-full flex flex-col items-center justify-center text-center max-w-lg mx-auto py-12">
                  <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-2xl mb-4 font-bold">
                    G
                  </div>
                  <h2 class="text-xl font-bold text-white mb-2">How can Mini GPT assist you today?</h2>
                  <p class="text-xs text-gray-400 mb-8">
                    Mini GPT is a miniature decoder-only model trained on synthetic reasoning, science, and computing dialogues.
                  </p>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full text-left">
                    {DEFAULT_PROMPTS.map((p, i) => (
                      <button
                        key={i}
                        onClick={() => handleSend(p)}
                        class="p-3.5 rounded-xl border border-gray-800 bg-gray-900/40 hover:bg-gray-800/60 hover:border-indigo-500/40 text-xs text-gray-300 transition"
                      >
                        {p}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {messages.map((msg) => (
                <div
                  key={msg.id}
                  class={`flex gap-3 max-w-3xl ${msg.role === "user" ? "ml-auto justify-end" : "mr-auto justify-start"}`}
                >
                  {msg.role === "assistant" && (
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-xs font-bold text-white shadow-md">
                      G
                    </div>
                  )}

                  <div class="flex flex-col">
                    <div
                      class={`px-4 py-3 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ${
                        msg.role === "user"
                          ? "bg-indigo-600 text-white rounded-br-none shadow-md shadow-indigo-600/10"
                          : "bg-[#181a24] text-gray-200 border border-gray-800/90 rounded-bl-none shadow-sm"
                      }`}
                    >
                      {msg.content}
                    </div>

                    {msg.role === "assistant" && msg.tokens > 0 && (
                      <div class="flex items-center gap-3 text-[10px] text-gray-500 mt-1.5 px-1 font-mono">
                        <span>{msg.tokens} tokens</span>
                        <span>·</span>
                        <span>{msg.latency.toFixed(0)} ms</span>
                        <span>·</span>
                        <span>{(msg.tokens / (msg.latency / 1000 || 1)).toFixed(0)} tok/s</span>
                      </div>
                    )}
                  </div>
                </div>
              ))}

              {isLoading && (
                <div class="flex gap-3 max-w-3xl mr-auto justify-start">
                  <div class="w-8 h-8 rounded-lg bg-indigo-600 flex-shrink-0 flex items-center justify-center text-xs font-bold text-white animate-pulse">
                    G
                  </div>
                  <div class="px-4 py-3 rounded-2xl bg-[#181a24] border border-gray-800 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-indigo-400 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-indigo-400 typing-dot"></span>
                  </div>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            {/* Input Bar */}
            <div class="p-4 md:px-24 border-t border-gray-800/80 bg-[#0f1117]">
              <form
                onSubmit={(e) => { e.preventDefault(); handleSend(); }}
                class="flex items-center gap-2 bg-[#181a24] border border-gray-700/80 focus-within:border-indigo-500 rounded-2xl p-1.5 shadow-xl transition"
              >
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  placeholder="Ask Mini GPT a question..."
                  disabled={isLoading}
                  class="flex-1 bg-transparent px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none"
                />
                <button
                  type="submit"
                  disabled={!input.trim() || isLoading}
                  class="w-9 h-9 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:hover:bg-indigo-600 text-white flex items-center justify-center transition flex-shrink-0"
                >
                  ▲
                </button>
              </form>
              <div class="text-[10px] text-center text-gray-500 mt-2">
                Mini GPT Architecture: Decoder-only Transformer · Trained from scratch with PyTorch.
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
